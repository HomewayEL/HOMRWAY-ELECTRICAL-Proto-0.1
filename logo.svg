<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="hw-title">
  <title id="hw-title">Homeway Electrical logo</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD966"/>
      <stop offset="1" stop-color="#E0A800"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- outer glow -->
  <circle cx="100" cy="100" r="98" fill="url(#glow)"/>
  <!-- badge -->
  <circle cx="100" cy="100" r="86" fill="#0B1B33" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- house -->
  <g filter="url(#shadow)">
    <path d="M100 42 L44 92 L58 92 L58 150 L142 150 L142 92 L156 92 Z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- lightning bolt -->
  <path d="M108 80 L84 118 L100 118 L92 146 L118 104 L102 104 L110 80 Z" fill="#38BDF8" stroke="#0B1B33" stroke-width="2" stroke-linejoin="round"/>
  <path d="M106 84 L88 114 L102 114 L96 136 L114 108 L100 108 Z" fill="url(#gold)"/>
</svg>
